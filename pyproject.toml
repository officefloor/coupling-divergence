[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sinew"
version = "0.1.0"
description = "Find heavy latent change-coupling (sinews): thick, repeatedly co-changed, call-edge-free method bundles that are expensive to refactor."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "Daniel Sagenschneider" }]
keywords = [
    "code-quality", "coupling", "co-change", "logical-coupling", "evolutionary-coupling",
    "change-coupling", "refactoring", "technical-debt", "git", "mining-software-repositories",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Version Control :: Git",
]
# PINNED, not >=, for reproducibility. These exact versions are validated at start-up
# (sinew/deps.py) and vendored into lib/ by setup.sh. lizard is the one extractor, for every
# language. Cognitive complexity is computed by a vendored estimator (sinew/cognitive.py),
# not a dependency.
#
# The sample (step 2), and the loop that clones each sampled repository at its pinned commit
# (step 3), both come from open-source-repository-sampler, so the same release draws and runs.
dependencies = [
    "lizard==1.23.0",
    "open-source-repository-sampler==0.1.0",
]

[project.scripts]
sinew = "sinew.cli:main"

[tool.setuptools]
packages = ["sinew"]
